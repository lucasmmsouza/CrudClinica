<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head('Cadastro')}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <h1 class="mt-4">Cadastro de Novo Usuário</h1>

    <form th:action="@{/cadastro}" th:object="${cadastroDTO}" method="post" class="card p-4 mt-3 bg-white shadow-sm rounded">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome Completo:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="usuario" class="form-label">Usuário (Login):</label>
                <input type="text" id="usuario" th:field="*{usuario}" class="form-control"
                       th:classappend="${#fields.hasErrors('usuario')} ? 'is-invalid' : ''" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('usuario')}" th:errors="*{usuario}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="senha" class="form-label">Senha:</label>
                <input type="password" id="senha" th:field="*{senha}" class="form-control"
                       th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid' : ''" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Eu sou:</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="tipoUsuario" id="tipoPaciente" value="PACIENTE" th:field="*{tipoUsuario}" onclick="mostrarCamposEspecificos()">
                <label class="form-check-label" for="tipoPaciente">Paciente</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="tipoUsuario" id="tipoMedico" value="MEDICO" th:field="*{tipoUsuario}" onclick="mostrarCamposEspecificos()">
                <label class="form-check-label" for="tipoMedico">Médico</label>
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('tipoUsuario')}" th:errors="*{tipoUsuario}"></div>
        </div>


        <div id="camposPaciente" class="d-none">
            <div class="mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input type="text" id="telefone" th:field="*{telefone}" class="form-control"
                       th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid' : ''" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
            </div>
        </div>

        <div id="camposMedico" class="d-none">
            <div class="mb-3">
                <label for="crm" class="form-label">CRM:</label>
                <input type="text" id="crm" th:field="*{crm}" class="form-control"
                       th:classappend="${#fields.hasErrors('crm')} ? 'is-invalid' : ''" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('crm')}" th:errors="*{crm}"></div>
            </div>
        </div>

        <div class="d-flex justify-content-start mt-3">
            <button type="submit" class="btn btn-primary me-2">Cadastrar</button>
            <a th:href="@{/login}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>

    <script>
        function mostrarCamposEspecificos() {
            const tipo = document.querySelector('input[name="tipoUsuario"]:checked').value;
            const camposPaciente = document.getElementById('camposPaciente');
            const camposMedico = document.getElementById('camposMedico');

            camposPaciente.classList.add('d-none');
            camposMedico.classList.add('d-none');

            if (tipo === 'PACIENTE') {
                camposPaciente.classList.remove('d-none');
            } else if (tipo === 'MEDICO') {
                camposMedico.classList.remove('d-none');
            }
        }
        // Garante que a função seja chamada ao carregar a página caso um valor já esteja selecionado (ex: erro de validação)
        document.addEventListener('DOMContentLoaded', () => {
            if(document.querySelector('input[name="tipoUsuario"]:checked')) {
                mostrarCamposEspecificos();
            }
        });
    </script>
</main>
</body>
</html>
