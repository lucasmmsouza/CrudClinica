<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head('Lista de Consultas')}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <h1 class="mt-4">Consultas</h1>

    <form th:action="@{/web/consultas}" method="get" class="row g-3 mb-3 align-items-center" sec:authorize="hasRole('ADMIN')">
        <div class="col-auto">
            <input type="date" name="data" class="form-control" th:value="${dataFiltro}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/web/consultas}" class="btn btn-secondary ms-2">Limpar</a>
        </div>
    </form>

    <a th:href="@{/web/consultas/novo}" class="btn btn-success mb-3" sec:authorize="isAuthenticated()">Nova Consulta</a>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="consulta : ${consultas}">
            <td th:text="${consulta.id}"></td>
            <td th:text="${consulta.data != null ? #temporals.format(consulta.data, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
            <td th:text="${consulta.paciente?.nome}"></td>
            <td th:text="${consulta.medico?.nome}"></td>
            <td>
                <span th:if="${consulta.status != null}"
                      th:text="${consulta.status}"
                      th:classappend="${consulta.status.name() == 'AGENDADA'} ? 'text-bg-warning' :
                                     (${consulta.status.name() == 'REALIZADA'} ? 'text-bg-success' : 'text-bg-danger')"
                      class="badge rounded-pill">
                </span>
                <span th:unless="${consulta.status != null}" class="badge rounded-pill text-bg-secondary">
                    Indefinido
                </span>
            </td>
            <td>
                <div class="d-flex flex-wrap gap-1">
                    <th:block th:if="${consulta.status != null and consulta.status.name() == 'AGENDADA'}">
                        <a th:href="@{'/web/consultas/marcar-realizada/' + ${consulta.id}}" class="btn btn-success btn-sm" title="Marcar como Realizada" sec:authorize="hasRole('ADMIN')">Realizada</a>
                        <a th:href="@{'/web/consultas/cancelar/' + ${consulta.id}}" class="btn btn-warning btn-sm" title="Cancelar Consulta">Cancelar</a>
                    </th:block>
                    <a th:href="@{'/web/consultas/editar/' + ${consulta.id}}" class="btn btn-primary btn-sm" title="Ver Detalhes" sec:authorize="hasRole('ADMIN')">Detalhes</a>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(consultas)}">
            <td colspan="6" class="text-center">Nenhuma consulta encontrada.</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Início</a>
</main>
</body>
</html>
