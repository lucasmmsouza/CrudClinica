<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head('Histórico do Paciente')}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
        <h1>Histórico de <span th:text="${paciente.nome}"></span></h1>
        <a th:href="@{/web/pacientes}" class="btn btn-secondary">Voltar para Pacientes</a>
    </div>

    <div th:if="${#lists.isEmpty(consultas)}" class="alert alert-info text-center">
        Nenhuma consulta encontrada para este paciente.
    </div>

    <div th:each="consulta : ${consultas}" class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                Consulta em <span th:text="${#temporals.format(consulta.data, 'dd/MM/yyyy HH:mm')}"></span>
                com Dr(a). <span th:text="${consulta.medico.nome}"></span>
            </h5>
        </div>
        <div class="card-body">
            <p><strong>Observações da Consulta:</strong> <span th:text="${consulta.observacao}"></span></p>

            <h6 class="mt-3">Exames Solicitados:</h6>
            <div th:if="${#lists.isEmpty(consulta.exames)}" class="text-muted">
                Nenhum exame solicitado nesta consulta.
            </div>
            <ul th:if="${!#lists.isEmpty(consulta.exames)}" class="list-group">
                <li th:each="exame : ${consulta.exames}" class="list-group-item">
                    <p class="mb-1"><strong>Exame:</strong> <span th:text="${exame.nomeExame}"></span></p>
                    <p class="mb-1"><strong>Tipo:</strong> <span th:text="${exame.tipoExame.nome}"></span></p>
                    <p class="mb-0 text-muted"><strong>Observações:</strong> <span th:text="${exame.observacoes}"></span></p>
                </li>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
