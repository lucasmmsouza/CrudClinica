<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head('Lista de Pacientes')}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <h1 class="mt-4">Pacientes</h1>

    <form th:action="@{/web/pacientes}" method="get" class="row g-3 mb-3 align-items-center">
        <div class="col-auto">
            <input type="text" name="nome" class="form-control" placeholder="Buscar por nome..." th:value="${nomeFiltro}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/web/pacientes}" class="btn btn-secondary ms-2">Limpar</a>
        </div>
    </form>

    <a th:href="@{/web/pacientes/novo}" class="btn btn-success mb-3">Novo Paciente</a>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Endereço</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="paciente : ${pacientes}">
            <td th:text="${paciente.id}"></td>
            <td th:text="${paciente.nome}"></td>
            <td th:text="${paciente.telefone}"></td>
            <td th:text="${paciente.endereco}"></td>
            <td>
                <a th:href="@{'/web/pacientes/editar/' + ${paciente.id}}" class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{'/web/pacientes/excluir/' + ${paciente.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir este paciente?');">Excluir</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pacientes)}">
            <td colspan="5" class="text-center">Nenhum paciente encontrado.</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Início</a>
</main>
</body>
</html>
