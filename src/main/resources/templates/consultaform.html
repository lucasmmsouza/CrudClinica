<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">

<head th:replace="~{fragments/head :: head(${consulta.id == null ? 'Nova Consulta' : 'Editar Consulta'})}"></head>

<body class="d-flex flex-column h-100">
<header th:replace="~{fragments/header :: header}"></header>

<main class="container flex-shrink-0">
    <h1 class="mt-4" th:text="${consulta.id == null ? 'Nova Consulta' : 'Editar Consulta'}"></h1>

    <form th:action="@{/web/consultas/salvar}" th:object="${consulta}" method="post" class="card p-4 mt-3 bg-white shadow-sm rounded">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="data" class="form-label">Data:</label>
            <input type="datetime-local" id="data" th:field="*{data}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor:</label>
            <input type="number" step="0.01" id="valor" th:field="*{valor}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label for="observacao" class="form-label">Observação:</label>
            <input type="text" id="observacao" th:field="*{observacao}" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="paciente" class="form-label">Paciente:</label>
            <select id="paciente" th:field="*{paciente}" class="form-select" required>
                <option value="">Selecione um Paciente</option>
                <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="medico" class="form-label">Médico:</label>
            <select id="medico" th:field="*{medico}" class="form-select" required>
                <option value="">Selecione um Médico</option>
                <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nome}"></option>
            </select>
        </div>

        <div class="d-flex justify-content-start">
            <button type="submit" class="btn btn-primary me-2">Salvar</button>
            <a th:href="@{/web/consultas}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
