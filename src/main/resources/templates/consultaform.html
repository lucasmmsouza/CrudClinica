<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head(${consulta.id == null ? 'Nova Consulta' : 'Editar Consulta'})}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <h1 class="mt-4" th:text="${consulta.id == null ? 'Nova Consulta' : 'Editar Consulta'}"></h1>

    <form th:action="@{/web/consultas/salvar}" th:object="${consulta}" method="post" class="card p-4 mt-3 bg-white shadow-sm rounded">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="agenda" class="form-label">Horário Disponível:</label>
            <select id="agenda" th:field="*{agenda}" class="form-select"
                    th:classappend="${#fields.hasErrors('agenda')} ? 'is-invalid' : ''">
                <option value="">Selecione um Horário</option>
                <option th:each="a : ${horariosDisponiveis}" th:value="${a.id}"
                        th:text="${a.medico.nome} + ' - ' + ${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm')}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('agenda')}" th:errors="*{agenda}"></div>
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor:</label>
            <input type="number" step="0.01" id="valor" th:field="*{valor}" class="form-control"
                   th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid' : ''" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
        </div>

        <div class="mb-3">
            <label for="observacao" class="form-label">Observação:</label>
            <input type="text" id="observacao" th:field="*{observacao}" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="paciente" class="form-label">Paciente:</label>
            <select id="paciente" th:field="*{paciente}" class="form-select"
                    th:classappend="${#fields.hasErrors('paciente')} ? 'is-invalid' : ''">
                <option value="">Selecione um Paciente</option>
                <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('paciente')}" th:errors="*{paciente}"></div>
        </div>

        <div class="d-flex justify-content-start">
            <button type="submit" class="btn btn-primary me-2">Salvar</button>
            <a th:href="@{/web/consultas}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</main>
</body>
</html>
