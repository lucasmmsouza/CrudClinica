<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head('Login')}"></th:block>
</head>
<body>
<main class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">Acessar Sistema</h2>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Usuário ou senha inválidos.
                </div>

                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    Você saiu do sistema.
                </div>

                <div th:if="${param.cadastro == 'sucesso'}" class="alert alert-success" role="alert">
                    Cadastro realizado com sucesso! Faça o login para continuar.
                </div>


                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p class="text-muted mb-0">Não tem uma conta?</p>
                    <a th:href="@{/cadastro}" class="btn btn-link">Cadastre-se</a>
                </div>
            </div>
        </div>
        <div class="text-center mt-3">
            <p class="text-muted">
                Use: admin/admin ou user/123
            </p>
        </div>
    </div>
</main>
</body>
</html>
