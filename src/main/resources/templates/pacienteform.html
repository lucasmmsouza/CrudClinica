<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head(${paciente.id == null ? 'Novo Paciente' : 'Editar Paciente'})}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <h1 class="mt-4" th:text="${paciente.id == null ? 'Novo Paciente' : 'Editar Paciente'}"></h1>

    <form th:action="@{/web/pacientes/salvar}" th:object="${paciente}" method="post" class="card p-4 mt-3 bg-white shadow-sm rounded">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{endereco.id}" />

        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>
        <div class="mb-3">
            <label for="telefone" class="form-label">Telefone:</label>
            <input type="text" id="telefone" th:field="*{telefone}" class="form-control"
                   th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid' : ''" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
        </div>

        <h5 class="mt-4">Endereço</h5>
        <hr>
        <div class="row">
            <div class="col-md-3 mb-3">
                <label for="cep" class="form-label">CEP:</label>
                <input type="text" id="cep" th:field="*{endereco.cep}" class="form-control" />
            </div>
            <div class="col-md-7 mb-3">
                <label for="rua" class="form-label">Rua:</label>
                <input type="text" id="rua" th:field="*{endereco.rua}" class="form-control" />
            </div>
            <div class="col-md-2 mb-3">
                <label for="numero" class="form-label">Número:</label>
                <input type="text" id="numero" th:field="*{endereco.numero}" class="form-control" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="bairro" class="form-label">Bairro:</label>
                <input type="text" id="bairro" th:field="*{endereco.bairro}" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label for="estado" class="form-label">Estado:</label>
                <select id="estado" th:field="*{endereco.estado}" class="form-select">
                    <option value="">Selecione um Estado</option>
                    <option th:each="estado : ${estados}" th:value="${estado.sigla}" th:text="${estado.nome}"></option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label for="cidade" class="form-label">Cidade:</label>
                <select id="cidade" name="endereco.cidade" class="form-select">
                    <option value="">Selecione um Estado primeiro</option>
                </select>
            </div>
        </div>

        <div class="d-flex justify-content-start mt-4">
            <button type="submit" class="btn btn-primary me-2">Salvar</button>
            <a th:href="@{/web/pacientes}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const estadoSelect = document.getElementById('estado');
        const cidadeSelect = document.getElementById('cidade');
        const cidadeSalva = /*[[${paciente.endereco.cidade}]]*/ null;

        function carregarCidades() {
            const estadoUf = estadoSelect.value;
            cidadeSelect.innerHTML = '<option value="">Carregando...</option>';

            if (estadoUf) {
                const apiUrl = `https://servicodados.ibge.gov.br/api/v1/localidades/estados/${estadoUf}/municipios`;

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('A resposta da rede não foi OK');
                        }
                        return response.json();
                    })
                    .then(data => {
                        cidadeSelect.innerHTML = '<option value="">Selecione uma Cidade</option>';
                        data.sort((a, b) => a.nome.localeCompare(b.nome));
                        data.forEach(cidade => {
                            const option = document.createElement('option');
                            option.value = cidade.nome;
                            option.text = cidade.nome;
                            if (cidade.nome === cidadeSalva) {
                                option.selected = true;
                            }
                            cidadeSelect.appendChild(option);
                        });
                     })
                    .catch(error => {
                        console.error("Erro na requisição fetch:", error);
                        cidadeSelect.innerHTML = '<option value="">Erro ao carregar cidades</option>';
                    });
            } else {
                cidadeSelect.innerHTML = '<option value="">Selecione um Estado primeiro</option>';
            }
        }

        estadoSelect.addEventListener('change', carregarCidades);

        document.addEventListener('DOMContentLoaded', () => {
            if (estadoSelect.value) {
                carregarCidades();
            }
        });
        /*]]>*/
    </script>
</main>
</body>
</html>
