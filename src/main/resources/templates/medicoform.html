<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head(${medico.id == null ? 'Novo Médico' : 'Editar Médico'})}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <h1 class="mt-4" th:text="${medico.id == null ? 'Novo Médico' : 'Editar Médico'}"></h1>

    <form th:action="@{/web/medicos/salvar}" th:object="${medico}" method="post" class="card p-4 mt-3 bg-white shadow-sm rounded">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" class="form-control"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label for="crm" class="form-label">CRM:</label>
            <input type="text" id="crm" th:field="*{crm}" class="form-control"
                   th:classappend="${#fields.hasErrors('crm')} ? 'is-invalid' : ''" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('crm')}" th:errors="*{crm}"></div>
        </div>

        <div class="d-flex justify-content-start">
            <button type="submit" class="btn btn-primary me-2">Salvar</button>
            <a th:href="@{/web/medicos}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</main>
</body>
</html>
