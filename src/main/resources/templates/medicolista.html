<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-100">

<head th:replace="~{fragments/head :: head('Lista de Médicos')}"></head>

<body class="d-flex flex-column h-100">

<header th:replace="~{fragments/header :: header}"></header>

<main class="container flex-shrink-0">
    <h1 class="mt-4">Médicos</h1>
    <a th:href="@{/web/medicos/novo}" class="btn btn-success mb-3">Novo Médico</a>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nome</th><th>CRM</th><th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="medico : ${medicos}">
            <td th:text="${medico.id}"></td>
            <td th:text="${medico.nome}"></td>
            <td th:text="${medico.crm}"></td>
            <td>
                <a th:href="@{'/web/medicos/editar/' + ${medico.id}}" class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{'/web/medicos/excluir/' + ${medico.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir este médico?');">Excluir</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(medicos)}">
            <td colspan="4" class="text-center">Nenhum médico cadastrado.</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Início</a>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/footer :: scripts}"></div>

</body>
</html>
