<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(head=~{::head}, main=~{::main})}">
<head>
    <th:block th:replace="~{fragments/head :: head('Lista de Médicos')}"></th:block>
</head>
<body>
<main class="container flex-shrink-0">
    <h1 class="mt-4">Médicos</h1>

    <form th:action="@{/web/medicos}" method="get" class="row g-3 mb-3 align-items-center">
        <div class="col-auto">
            <input type="text" name="nome" class="form-control" placeholder="Buscar por nome..." th:value="${nomeFiltro}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a th:href="@{/web/medicos}" class="btn btn-secondary ms-2">Limpar</a>
        </div>
    </form>

    <a th:href="@{/web/medicos/novo}" class="btn btn-success mb-3">Novo Médico</a>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nome</th><th>CRM</th><th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="medico : ${medicos}">
            <td th:text="${medico.id}"></td>
            <td th:text="${medico.nome}"></td>
            <td th:text="${medico.crm}"></td>
            <td>
                <a th:href="@{'/web/medicos/editar/' + ${medico.id}}" class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{'/web/medicos/excluir/' + ${medico.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Tem certeza que deseja excluir este médico?');">Excluir</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(medicos)}">
            <td colspan="4" class="text-center">Nenhum médico encontrado.</td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Início</a>
</main>
</body>
</html>
